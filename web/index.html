<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMO 城市气候统计图 · 网页工具</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">WMO</span>
    <span class="brand-text">城市气候统计图</span>
  </div>

  <label class="field inline">
    <span class="label">配置</span>
    <select id="profile-select" title="选择配置"></select>
  </label>
  <span id="profile-source" class="muted small"></span>
  <span id="dirty-badge" class="badge warn hidden">● 有未保存修改</span>

  <div class="spacer"></div>

  <label class="switch" title="开启后本次出图只在网页显示，不写入本地 output 目录">
    <input type="checkbox" id="no-save-toggle">
    <span class="switch-track"><span class="switch-thumb"></span></span>
    <span class="switch-text">不保存</span>
  </label>

  <button id="btn-marks" class="ghost" title="按 --mark 语法快速微调">快捷微调</button>
  <button id="btn-final" class="ghost" title="查看套用当前表单值后的最终配置">最终配置</button>
  <button id="btn-template" class="ghost" title="导出全量配置模板">导出模板</button>
  <button id="btn-cache" class="ghost" title="缓存占用与清理">缓存</button>
  <button id="btn-run" class="primary" title="按当前表单值出图">出图</button>
</header>

<main class="layout">
  <!-- ============ 左：目标城市 + 配置 ============ -->
  <section class="column left">
    <div class="card target-card">
      <div class="card-head">
        <h2>目标城市</h2>
        <span class="muted small" id="mode-hint"></span>
      </div>
      <div class="mode-row" id="mode-row">
        <label class="chip"><input type="radio" name="mode" value="city" checked><span>单城 / 批量</span></label>
        <label class="chip"><input type="radio" name="mode" value="compare"><span>多城市对比</span></label>
        <label class="chip"><input type="radio" name="mode" value="multi"><span>多图（同画布）</span></label>
      </div>
      <div class="target-input">
        <textarea id="city-input" rows="2"
          placeholder="cityId 或城市名，逗号分隔，如：237,北京,香港"></textarea>
        <div class="target-actions">
          <button id="btn-resolve" class="ghost small">反查编号</button>
          <button id="btn-search-city" class="ghost small">查询城市</button>
          <span class="sep" aria-hidden="true"></span>
          <label class="field checkbox">
            <input type="checkbox" id="refresh-cache">
            <span>忽略缓存，强制重新请求</span>
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="refresh-index">
            <span>强制刷新城市索引</span>
          </label>
        </div>
      </div>
      <div class="inline-fields" id="mode-extra">
        <label class="field hidden" id="grid-field">
          <span class="label">排列（列x行）</span>
          <input id="grid-input" list="grid-options" placeholder="auto / 2x2 / 3x2">
          <datalist id="grid-options">
            <option value="auto"></option><option value="1x2"></option>
            <option value="2x1"></option><option value="2x2"></option>
            <option value="3x2"></option><option value="2x3"></option>
            <option value="3x3"></option>
          </datalist>
        </label>
        <div class="field hidden" id="metric-field">
          <span class="label" title="最多可勾 4 个元素；都不勾 = 用配置里的取值">对比元素</span>
          <div class="checkbox-grid" id="metric-checks">
            <label><input type="checkbox" value="minTemp"><span>日均最低气温</span></label>
            <label><input type="checkbox" value="maxTemp"><span>日均最高气温</span></label>
            <label><input type="checkbox" value="meanTemp"><span>日均气温</span></label>
            <label><input type="checkbox" value="rainfall"><span>降水量</span></label>
            <label><input type="checkbox" value="raindays"><span>降水日数</span></label>
          </div>
          <span class="muted small hidden" id="metric-hint"></span>
        </div>
        <label class="field hidden" id="compare-mode-field">
          <span class="label">多元素呈现</span>
          <select id="compare-mode">
            <option value="">（用配置里的取值）</option>
            <option value="facet">分面：一格一元素</option>
            <option value="overlay">叠加：同一张图</option>
          </select>
        </label>
      </div>
      <div id="city-resolved" class="resolved small"></div>
    </div>

    <div class="card config-card">
      <div class="card-head">
        <h2>配置项</h2>
        <span class="muted small" id="config-summary"></span>
        <div class="spacer"></div>
        <button id="btn-reset-all" class="ghost small">全部还原</button>
        <button id="btn-save" class="ghost small">保存修改</button>
        <button id="btn-save-as" class="ghost small">另存为…</button>
      </div>
      <div class="config-toolbar">
        <input id="config-search" placeholder="搜索配置项：名称 / 路径 / 说明">
        <label class="field checkbox small">
          <input type="checkbox" id="only-changed"><span>只看已修改</span>
        </label>
      </div>
      <div id="config-groups" class="config-groups"></div>
    </div>
  </section>

  <!-- ============ 分隔条：拖动调整左右宽度 ============ -->
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="左右分栏宽度"
       title="拖动调整左右宽度（双击复位，← → 微调）；左部限制在窗口宽度的 1/3 ~ 1/2"></div>

  <!-- ============ 右：显示区 ============ -->
  <section class="column right">
    <div class="card result-card">
      <div class="card-head">
        <h2>显示区</h2>
        <span id="result-status" class="badge hidden"></span>
        <div class="spacer"></div>
        <button id="btn-cancel" class="ghost small hidden">取消任务</button>
        <button id="btn-fit" class="ghost small">适应宽度</button>
        <button id="btn-download-chart" class="primary small" disabled>另存本地图片</button>
      </div>

      <div class="tabs" id="result-tabs">
        <button class="tab active" data-tab="chart">图表</button>
        <button class="tab" data-tab="table">表格</button>
        <button class="tab" data-tab="log">运行日志</button>
        <button class="tab" data-tab="warn">提示<span id="warn-count" class="count hidden">0</span></button>
      </div>

      <div class="tab-body">
        <div class="tab-pane active" data-pane="chart">
          <div id="chart-strip" class="strip"></div>
          <div id="chart-stage" class="stage">
            <div class="empty">
              <p>还没有图。</p>
              <p class="muted">在左侧填入城市，点右上角「出图」即可即时显示。</p>
            </div>
          </div>
          <div id="chart-meta" class="meta muted small"></div>
        </div>

        <div class="tab-pane" data-pane="table">
          <div id="table-picker" class="strip"></div>
          <div id="table-stage" class="stage table-stage">
            <div class="empty"><p class="muted">还没有表格。</p></div>
          </div>
        </div>

        <div class="tab-pane" data-pane="log">
          <div class="log-toolbar">
            <label class="field checkbox small">
              <input type="checkbox" id="log-autoscroll" checked><span>自动滚动</span>
            </label>
            <div class="spacer"></div>
            <label class="field checkbox small"><input type="checkbox" class="log-level" value="debug" checked><span>DEBUG</span></label>
            <label class="field checkbox small"><input type="checkbox" class="log-level" value="info" checked><span>INFO</span></label>
            <label class="field checkbox small"><input type="checkbox" class="log-level" value="warning" checked><span>警告</span></label>
            <label class="field checkbox small"><input type="checkbox" class="log-level" value="error" checked><span>错误</span></label>
            <button id="btn-clear-log" class="ghost small">清空</button>
          </div>
          <div id="log-stream" class="log-stream"></div>
        </div>

        <div class="tab-pane" data-pane="warn">
          <div id="warn-list" class="warn-list"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/static/js/api.js"></script>
<script src="/static/js/form.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
